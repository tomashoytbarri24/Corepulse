# V460: servidor de referencia para piloto privado. Requiere Linux con GPU NVIDIA.
# Solo Caddy publica 80/443. API y modelo no publican puertos en el host.
name: corepulse-ai-cloud
services:
  proxy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      COREPULSE_CLOUD_DOMAIN: ${COREPULSE_CLOUD_DOMAIN:?Configura dominio DNS real}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks: [edge]
    security_opt: [no-new-privileges:true]

  api:
    build:
      context: ../CorePulse_AI_Server
    restart: unless-stopped
    env_file: [.env]
    environment:
      COREPULSE_AI_DATA_DIR: /var/lib/corepulse-ai
      COREPULSE_MODEL_BASE_URL: http://model:8000/v1
      COREPULSE_MODEL_NAME: ${COREPULSE_MODEL_NAME:?Configura modelo}
      COREPULSE_MODEL_API_KEY: ${COREPULSE_MODEL_API_KEY:?Configura clave interna aleatoria}
    volumes:
      - corepulse_data:/var/lib/corepulse-ai
    networks: [edge, inference]
    read_only: true
    tmpfs:
      - /tmp
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Intencionalmente sin 'ports': el acceso externo es solo por proxy HTTPS.

  model:
    image: ${COREPULSE_VLLM_IMAGE:-vllm/vllm-openai:latest}
    restart: unless-stopped
    gpus: all
    ipc: host
    command:
      - --model
      - ${COREPULSE_MODEL_NAME:?Configura modelo}
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --api-key
      - ${COREPULSE_MODEL_API_KEY:?Configura clave interna aleatoria}
      - --max-model-len
      - "4096"
      - --gpu-memory-utilization
      - "0.85"
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks: [inference]
    # Sin ports: no se puede llegar directamente al modelo desde Internet.

networks:
  edge: {}
  inference: {}

volumes:
  corepulse_data: {}
  hf_cache: {}
  caddy_data: {}
  caddy_config: {}
